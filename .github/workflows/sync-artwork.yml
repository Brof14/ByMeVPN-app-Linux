name: Restore pinned Windows design asset

on:
  push:
    branches: [feat/linux-desktop-port]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-globe:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/feat/linux-desktop-port'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/linux-desktop-port
      - name: Download and verify original 1.8 MB globe image
        run: bash scripts/restore-ui-assets.sh
      - name: Commit exact original image to Linux repository
        run: |
          if git diff --quiet -- ui/assets/globe.png; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/assets/globe.png
          git commit -m "assets: preserve original Windows globe artwork"
          git push origin HEAD:feat/linux-desktop-port
