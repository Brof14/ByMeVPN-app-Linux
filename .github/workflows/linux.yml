name: Linux CI and installers

on:
  push:
    branches: [main, feat/linux-desktop-port]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore original artwork
        run: bash scripts/restore-ui-assets.sh
      - name: Validate JavaScript
        run: node --check ui/app.js
      - name: UI contract tests
        run: node --test tests/frontend-contract.test.mjs

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - name: Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  package:
    runs-on: ubuntu-24.04
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - name: Restore original artwork
        run: bash scripts/restore-ui-assets.sh
      - name: Build .deb and .AppImage
        run: npx --yes @tauri-apps/cli@2 build
      - name: Upload preview installers
        uses: actions/upload-artifact@v4
        with:
          name: ByMeVPN-Linux-Preview
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
